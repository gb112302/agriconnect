                          <h4 className="text-xl sm:text-3xl font-bold mb-2 sm:mb-4 group-hover:text-agri-primary transition-colors duration-700 text-slate-800 tracking-tight">
                            {m.name}
                          </h4>
                          <p className="text-slate-500 text-base sm:text-xl leading-relaxed font-medium">
                            {m.text}
                          </p>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            );
          }

          if (slide.theme === "credentials") {
            const colorMap = {
              "agri-primary": { bg: "#15803d", light: "#f0fdf4", text: "#15803d" },
              "slate-700":    { bg: "#334155", light: "#f1f5f9", text: "#334155" },
              "agri-dark":    { bg: "#14532d", light: "#dcfce7", text: "#14532d" },
            };
            return (
              <div className="min-h-screen p-6 pt-28 sm:p-16 sm:pt-36 lg:p-24 lg:pt-36 bg-slate-900 text-white flex flex-col justify-center">
                <div className="mb-10 sm:mb-16 animate-up">
                  <h2 className="text-4xl sm:text-6xl lg:text-7xl font-brand tracking-tight mb-3">{slide.title}</h2>
                  <p className="text-lg sm:text-2xl text-slate-400 italic">{slide.subtitle}</p>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-6 sm:gap-10 animate-up" style={{animationDelay:"0.2s"}}>
                  {slide.accounts.map((acc, i) => {
                    const c = colorMap[acc.color] || colorMap["agri-primary"];
                    return (
                      <div key={i} className="rounded-[2rem] overflow-hidden shadow-2xl" style={{background:"rgba(255,255,255,0.05)", border:"1px solid rgba(255,255,255,0.08)"}}>
                        {/* Card Header */}
                        <div className="p-6 sm:p-8 flex items-center gap-5" style={{background: c.bg}}>
                          <div className="w-14 h-14 rounded-2xl flex items-center justify-center" style={{background:"rgba(255,255,255,0.15)"}}>
                            <span className="material-icons text-white text-3xl">{acc.icon}</span>
                          </div>
                          <div>
                            <div className="text-[10px] font-black tracking-[0.3em] uppercase text-white/60 mb-1">Role</div>
                            <div className="text-2xl sm:text-3xl font-brand text-white">{acc.role}</div>
                          </div>
                        </div>
                        {/* Credentials */}
                        <div className="p-6 sm:p-8 space-y-4">
                          <div className="rounded-2xl p-4" style={{background:"rgba(255,255,255,0.07)"}}>
                            <div className="text-[9px] uppercase tracking-[0.3em] text-slate-400 font-black mb-1">📧 Email</div>
                            <div className="font-mono text-sm sm:text-base text-white font-bold">{acc.email}</div>
                          </div>
                          <div className="rounded-2xl p-4" style={{background:"rgba(255,255,255,0.07)"}}>
                            <div className="text-[9px] uppercase tracking-[0.3em] text-slate-400 font-black mb-1">🔑 Password</div>
                            <div className="font-mono text-sm sm:text-base text-white font-bold">{acc.password}</div>
                          </div>
                          <div className="rounded-2xl p-4" style={{background:"rgba(255,255,255,0.04)"}}>
                            <div className="text-[9px] uppercase tracking-[0.3em] text-slate-400 font-black mb-2">🚀 How to Access</div>
                            <div className="text-xs sm:text-sm text-slate-300 font-medium">{acc.action}</div>
                          </div>
                          <ul className="space-y-2 pt-2">
                            {acc.perks.map((p, j) => (
                              <li key={j} className="flex items-center gap-3 text-slate-300 text-sm">
                                <span className="w-2 h-2 rounded-full flex-shrink-0" style={{background: c.bg}}></span>
                                {p}
                              </li>
                            ))}
                          </ul>
                        </div>
                      </div>
                    );
                  })}
                </div>
                {/* Warning note */}
                <div className="mt-8 sm:mt-12 animate-up rounded-2xl p-4 sm:p-6 border border-yellow-400/30 text-yellow-300 text-sm sm:text-base font-medium" style={{background:"rgba(250,204,21,0.07)", animationDelay:"0.4s"}}>
                  <span className="material-icons text-yellow-400 align-middle mr-2 text-lg">warning</span>
                  {slide.note}
                </div>
              </div>
            );
          }

          if (slide.type === "end") {
            return (
              <div className="min-h-screen flex flex-col items-center justify-center text-center p-8 pt-32 sm:p-12 sm:pt-40 bg-agri-light text-agri-dark relative overflow-hidden">
                <div className="absolute top-0 right-0 w-[80vw] sm:w-[60vw] h-[80vw] sm:h-[60vw] bg-agri-primary/5 rounded-full blur-[80px] sm:blur-[100px] -mr-32 sm:-mr-64 -mt-32 sm:-mt-64"></div>
                <div className="relative z-10 animate-up flex flex-col items-center">
                  <div className="w-20 h-20 sm:w-28 sm:h-28 bg-gradient-to-br from-agri-primary to-agri-dark rounded-[2rem] sm:rounded-[3rem] flex items-center justify-center mb-10 sm:mb-16 shadow-2xl rotate-12 hover:rotate-0 transition-transform duration-700 cursor-pointer">
                    <span className="material-icons text-white text-4xl sm:text-5xl">
                      auto_awesome
                    </span>
                  </div>
                  <h2 className="text-6xl sm:text-8xl lg:text-9xl font-brand leading-none mb-4 sm:mb-6 tracking-tighter text-agri-dark">
                    {slide.title}
                  </h2>
                  <p className="text-xl sm:text-3xl font-light text-slate-500 mb-12 sm:mb-20 tracking-wide uppercase">
                    {slide.subtitle}
                  </p>
                  <a
                    href="https://github.com/gb112302"
                    target="_blank"
                    className="inline-block bg-agri-primary text-white px-12 sm:px-24 py-4 sm:py-8 rounded-full text-lg sm:text-2xl font-bold hover:bg-agri-dark transition-all duration-500 shadow-[0_25px_60px_-15px_rgba(21,128,61,0.4)] transform hover:-translate-y-2 active:scale-95"
                  >
                    {slide.cta}
                  </a>
                  <div className="mt-12 sm:mt-20 flex flex-col items-center gap-6 sm:gap-8">
                    <div className="flex flex-wrap justify-center gap-6 sm:gap-10">
                      <a
                        href={slide.whatsapp}
                        target="_blank"
                        className="flex items-center gap-3 text-agri-primary hover:text-agri-dark transition-colors group"
                      >
                        <div className="w-10 h-10 bg-agri-light rounded-full flex items-center justify-center group-hover:bg-agri-primary group-hover:text-white transition-all">
                          <span className="material-icons text-xl">chat</span>
                        </div>
                        <span className="font-bold text-base sm:text-lg">
                          WhatsApp
                        </span>
                      </a>
                      <a
                        href={`mailto:${slide.Mail}`}
                        className="flex items-center gap-3 text-agri-primary hover:text-agri-dark transition-colors group"
                      >
                        <div className="w-10 h-10 bg-agri-light rounded-full flex items-center justify-center group-hover:bg-agri-primary group-hover:text-white transition-all">
                          <span className="material-icons text-xl">mail</span>
                        </div>
                        <span className="font-bold text-base sm:text-lg">
                          Email
                        </span>
                      </a>
                    </div>
                    <a
                      href={`tel:${slide.contact}`}
                      className="mt-8 flex items-center gap-3 text-agri-dark hover:text-agri-primary transition-colors duration-300"
                    >
                      <span className="material-icons text-xl">call</span>
                      <span className="text-2xl sm:text-3xl font-bold tracking-tight">
                        {slide.contact}
                      </span>
                    </a>
                  </div>
                </div>
              </div>
            );
          }
        };

        return (
          <div className="relative w-full bg-white">
            {/* Header Persistent Branding */}
            <div className="fixed top-0 left-0 right-0 z-50 flex items-center gap-4 sm:gap-6 p-6 sm:p-8 lg:p-12 pointer-events-none">
              <div className="w-10 h-10 sm:w-14 sm:h-14 bg-white/90 backdrop-blur rounded-xl sm:rounded-[1.5rem] flex items-center justify-center shadow-xl pointer-events-auto">
                <span className="material-icons text-agri-primary text-2xl sm:text-3xl">
                  spa
                </span>
              </div>
              <span className="font-bold text-2xl sm:text-3xl tracking-tighter logo-gradient pointer-events-auto">
                AgriConnect<span className="text-agri-primary">.</span>
              </span>
            </div>

            <div className="w-full">
              {slides.map((slide, index) => (
                <section key={index} className="min-h-screen relative">
                  {renderSlide(slide)}
                </section>
              ))}
            </div>
          </div>
        );
      }

      // Final Render Trigger
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
